<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>maplibregl-recorder demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="../dist/maplibregl-recorder.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            font: 14px/1.4 system-ui, sans-serif;
        }

        #map {
            position: absolute;
            inset: 0 0 64px 0;
        }

        #bar {
            position: absolute;
            inset: auto 0 0 0;
            height: 64px;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 0 12px;
            background: #111;
            color: #eee;
            box-sizing: border-box;
        }

        #bar button {
            font: inherit;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: #eee;
            cursor: pointer;
        }

        #bar label {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        #place {
            font-weight: bold;
            min-width: 140px;
        }

        .pin {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            background: #e5533d;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="bar">
        <button id="prev">◀ Prev</button>
        <button id="next">Next ▶</button>
        <span id="place"></span>
        <label><input type="checkbox" id="terrain" checked /> terrain</label>
        <label>zoom <input type="number" id="zoom" value="14" min="1" max="20" style="width:4em" /></label>
        <span style="margin-left:auto;opacity:.6">record with the control, bottom right</span>
    </div>

    <script type="module">
        // v6 and later ship ESM only, so the namespace has to be imported rather
        // than picked up off `window` from a UMD bundle. A module namespace object
        // is read-only, so it gets copied into a plain object the recorder can
        // patch - the application then has to go through the copy.
        import * as maplibre from 'https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs';
        import { MaplibreRecorder, RecorderControl } from '../dist/maplibregl-recorder.mjs';
        const maplibregl = { ...maplibre };

        // Attach BEFORE any map is created, so the constructor options are captured too.
        MaplibreRecorder.attach(maplibregl);

        const params = new URLSearchParams(location.search);
        const withTerrain = params.get('terrain') !== '0';
        document.getElementById('terrain').checked = withTerrain;

        // The "browse locations with prev/next" pattern: every step flies to a
        // coordinate and drops a marker with a popup on it. Record a few steps and
        // hit Export to see what the reproduction looks like.
        const places = [
            { name: 'Valley floor', center: [11.39085, 47.27574] },
            { name: 'North ridge', center: [11.38200, 47.31300] },
            { name: 'South summit', center: [11.46200, 47.20800] },
            { name: 'Upper station', center: [11.37800, 47.30500] },
            { name: 'South village', center: [11.40800, 47.22800] }
        ];
        let index = 0;
        let marker = null;

        const map = new maplibregl.Map({
            container: 'map',
            zoom: 12,
            center: places[0].center,
            pitch: 60,
            maxPitch: 85,
            style: {
                version: 8,
                sources: {
                    osm: {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap Contributors',
                        maxzoom: 19
                    },
                    terrain: {
                        type: 'raster-dem',
                        tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
                        tileSize: 512,
                        encoding: 'terrarium',
                        maxzoom: 12
                    }
                },
                layers: [{ id: 'osm', type: 'raster', source: 'osm' }],
                terrain: withTerrain ? { source: 'terrain', exaggeration: 1 } : undefined
            }
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

        // The recorder's own panel is a control like any other. It drives the
        // engine attached above, and keeps itself out of the recording.
        map.addControl(new RecorderControl(), 'bottom-right');

        function show(step) {
            index = (step + places.length) % places.length;
            const place = places[index];
            document.getElementById('place').textContent = place.name;

            marker?.remove();

            const element = document.createElement('div');
            element.className = 'pin';
            element.textContent = String(index + 1);

            marker = new maplibregl.Marker({ element })
                .setLngLat(place.center)
                .setPopup(new maplibregl.Popup({ offset: 24 }).setHTML(`<b>${place.name}</b>`))
                .addTo(map);

            map.flyTo({ center: place.center, zoom: Number(document.getElementById('zoom').value) });
        }

        document.getElementById('next').addEventListener('click', () => show(index + 1));
        document.getElementById('prev').addEventListener('click', () => show(index - 1));
        document.getElementById('terrain').addEventListener('change', e => {
            params.set('terrain', e.target.checked ? '1' : '0');
            location.search = params.toString();
        });

        map.on('load', () => show(0));
    </script>
</body>

</html>
