name: Publish docs

on:
  push:
    branches: [ main ]

# Pages is served from the artifact this workflow uploads, so there is no
# gh-pages branch to push to and no need to hand the job write access to the
# repository. `id-token` is what lets the deployment prove it came from here.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run still waiting in the queue is superseded, but a
# run already deploying is left to finish rather than cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js x64
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Build the docs
        run: |
          npm ci
          npm run build-dist
          npm run docs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          # Pages takes eight to ten minutes to serve a deployment for this
          # repository, which is close enough to the ten minute default to fail
          # roughly half the time. The wait is on GitHub's side and nothing here
          # makes it shorter, so give it room rather than cancel a deployment
          # that was going to succeed.
          timeout: 1800000
